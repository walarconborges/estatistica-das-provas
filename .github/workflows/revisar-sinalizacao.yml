name: Revisar sinalizações
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  revisar:
    if: >-
      github.event.sender.login == github.repository_owner &&
      github.event.issue.state == 'open' &&
      (github.event.comment.body == 'aprovar' || github.event.comment.body == 'rejeitar')
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Aplicar decisão
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DECISION: ${{ github.event.comment.body }}
        run: node scripts/resolve-flag.mjs
