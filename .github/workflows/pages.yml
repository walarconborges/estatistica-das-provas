name: Publicar site
on:
  push:
    branches: [main]
    # Commits automáticos com provas, respostas e cache de IA não
    # alteram o site estático e não devem cancelar sua publicação.
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras e sintaxe
        run: |
          npm run check
          npm test
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar somente arquivos públicos
        run: |
          mkdir public
          cp index.html styles.css app.mjs core.mjs pdf-import.mjs pdf-layout.mjs study-context.mjs topic-taxonomy.mjs programa-candeias-505.mjs programa-semed-professor.mjs programa-semed-secretaria.mjs edital-classification.mjs sync-client.mjs assertion-guide.mjs answer-display-cache.mjs difficulty-pie.mjs config.js public/
          mkdir -p public/data/laws public/worker
          cp data/laws/*.json public/data/laws/
          cp worker/legal-knowledge.mjs public/worker/
          node build-pages.mjs public '${{ github.sha }}'
      - name: Enviar conteúdo
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      # O upload pode estar concluído antes de o pacote aparecer na API.
      # Evita a falha intermitente "No artifacts named github-pages".
      - name: Aguardar reconhecimento do pacote no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for tentativa in {1..18}; do
            quantidade=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo "0")
            if [ "$quantidade" = "1" ]; then
              echo "Pacote github-pages registrado e disponível."
              exit 0
            fi
            echo "Pacote ainda não disponível (encontrados: $quantidade)."
            sleep 5
          done
          echo "::error::Não foi possível confirmar um único pacote github-pages."
          exit 1
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
