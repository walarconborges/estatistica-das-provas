name: Publicar site
on:
  push:
    branches: [main]
    # Commits automáticos com provas, respostas e cache de IA não
    # alteram o site estático e não devem cancelar sua publicação.
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras e sintaxe
        run: |
          npm run check
          npm test
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar somente arquivos públicos
        run: |
          mkdir public
          cp index.html styles.css app.mjs core.mjs pdf-import.mjs pdf-layout.mjs study-context.mjs programa-candeias-505.mjs sync-client.mjs config.js public/
      - name: Enviar conteúdo
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
